name: Build Android APK

# Se ejecuta en cada push a main, y también se puede lanzar manualmente
# desde la pestaña "Actions" del repo (botón "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 (necesario para Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: npm install

      # Usa una firma de depuración fija (debug.keystore, subido al repo) en vez
      # de la que Gradle genera sola en cada corrida — así el APK queda firmado
      # igual siempre y se puede instalar encima del anterior sin desinstalar.
      - name: Usar firma de depuración estable
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      # El uploader web de GitHub no conserva permisos de ejecución de Unix —
      # gradlew llega como solo-lectura, causando "Permission denied" (exit 126).
      - name: Restaurar permiso de ejecución de gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: quantrex-chofer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
